<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Wonke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b2038;--bg-soft:#262c4c;--paper:#fbf3ee;--ink:#f6e9e4;--accent:#f4a6a0;--muted:#a9aecb;--card-ink:#3a2f3a;color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 700px at 50% -10%,var(--bg-soft),var(--bg));color:var(--ink);font-family:'Lora',Georgia,serif;line-height:1.75;min-height:100vh}
.hand{font-family:'Caveat','Segoe Script',cursive}
#lock{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem;text-align:center;background:radial-gradient(900px 600px at 50% 40%,var(--bg-soft),var(--bg))}
#lock h1{font-size:clamp(2.6rem,10vw,4.4rem);margin:0;font-weight:700;color:var(--accent);line-height:1.1}
#lock p{margin:0;color:var(--muted)}
#form{display:flex;gap:.5rem;margin-top:.5rem;width:min(360px,100%)}
#pw{flex:1;min-width:0;padding:.8rem 1rem;font:inherit;font-size:1rem;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:999px}
#pw:focus,#go:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#go{padding:.8rem 1.3rem;font:inherit;font-weight:500;cursor:pointer;background:var(--accent);color:#2b1d28;border:0;border-radius:999px}
#err{min-height:1.5em;color:#ffc9c4;font-size:.95rem}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#site{display:none;padding:clamp(2rem,6vw,5rem) 1.25rem 4rem;max-width:980px;margin:0 auto}
#site.open{display:block;animation:rise 1.2s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
header{text-align:center;margin-bottom:3rem}
header h2{font-size:clamp(3rem,12vw,5.4rem);margin:0;color:var(--accent);line-height:1.05;font-weight:700}
header p{color:var(--muted);margin:.5rem 0 0}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem 1.5rem;padding:1rem 0 3rem}
figure{margin:0;background:var(--paper);color:var(--card-ink);padding:.8rem .8rem 1rem;border-radius:3px;box-shadow:0 14px 30px rgba(0,0,0,.35)}
figure:nth-child(odd){transform:rotate(-2deg)}
figure:nth-child(even){transform:rotate(1.6deg);margin-top:1.2rem}
figure:nth-child(3n){transform:rotate(-.8deg)}
.frame{aspect-ratio:4/5;background:#e6d6d3;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
figcaption{font-size:1.7rem;text-align:center;padding-top:.5rem;line-height:1.2}
.letter{max-width:660px;margin:1rem auto 0;padding:clamp(1.5rem,5vw,3rem);background:rgba(255,255,255,.06);border-left:3px solid var(--accent);border-radius:4px;font-size:1.08rem}
.letter p{margin:0 0 1.1rem}
.letter .sign{font-size:2.2rem;color:var(--accent);margin:1.5rem 0 0;line-height:1.2}
.music{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:5;display:none;align-items:center;gap:.5rem;padding:.6rem 1rem;font:inherit;font-size:.95rem;color:var(--ink);background:rgba(27,32,56,.85);border:1px solid rgba(255,255,255,.25);border-radius:999px;cursor:pointer;backdrop-filter:blur(6px)}
.music.show{display:inline-flex}
.music:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#site.open,.shake{animation:none}}
</style>
</head>
<body>
<section id="lock">
  <h1 class="hand">Just for you, Wonke</h1>
  <p>Hint: wonke + yanda</p>
  <form id="form" autocomplete="off">
    <input id="pw" type="password" placeholder="Password" aria-label="Password" autocapitalize="none" autocorrect="off">
    <button id="go" type="submit">Open</button>
  </form>
  <div id="err" role="alert"></div>
</section>
<audio id="song" src="music.mp3" loop preload="auto"></audio>
<button id="musicBtn" class="music" type="button" aria-label="Pause music">Pause music</button>
<main id="site">
  <header>
    <h2 class="hand">Wonke &amp; Yanda</h2>
    <p>A few of my favorite moments of us</p>
  </header>
  <div class="wall" id="wall"></div>
  <article class="letter" id="letter"></article>
</main>

const $=id=>document.getElementById(id);
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function build(){
  C.photos.forEach(p=>{
    const f=document.createElement("figure"),fr=document.createElement("div");fr.className="frame";
    const i=new Image();i.alt=p.caption;i.src=p.src;i.style.objectPosition=p.pos;fr.appendChild(i);
    const c=document.createElement("figcaption");c.className="hand";c.textContent=p.caption;
    f.append(fr,c);$("wall").appendChild(f);
  });
  C.letter.forEach(t=>{const p=document.createElement("p");p.textContent=t;$("letter").appendChild(p)});
  const s=document.createElement("p");s.className="sign hand";s.textContent="Love, Ayanda";$("letter").appendChild(s);
}
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const a=$("pw").value.trim().toLowerCase();
  let ok=false;
  try{ok=(await sha(a))===C.hash}catch(_){$("err").textContent="Open this page from its web link to unlock it.";return}
  if(ok){build();
    const au=$("song"),mb=$("musicBtn");
    mb.classList.add("show");
    const sync=()=>{mb.textContent=au.paused?"Play music":"Pause music";mb.setAttribute("aria-label",mb.textContent)};
    au.addEventListener("play",sync);au.addEventListener("pause",sync);
    mb.onclick=()=>{au.paused?au.play().catch(()=>{}):au.pause()};
    au.volume=0.7;au.play().catch(()=>{});sync();
    $("lock").style.display="none";$("site").classList.add("open");window.scrollTo(0,0)}
  else{$("err").textContent="Not quite. Try again.";const f=$("form");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");$("pw").select()}
});
</script>
